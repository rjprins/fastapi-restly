name: Latest versions

# Test the newest dependency resolutions on pull requests and every week.
# The regular CI workflow also tests locked and minimum dependency versions.

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            example-projects/*/uv.lock

      - name: Upgrade all lockfiles to the latest resolutions
        run: |
          uv lock --upgrade
          for d in example-projects/*/; do (cd "$d" && uv lock --upgrade); done

      - name: Install dependencies
        run: make install-dev

      - name: Record installed versions
        run: |
          uv pip freeze
          for project in shop blog saas; do
            uv --directory "example-projects/$project" pip freeze
          done

      - name: Run framework and example tests
        run: make test-all
