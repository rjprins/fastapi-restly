[project]
name = "shop"
version = "0.1.0"
description = "A FastAPI-Restly example featuring customizations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.12",
    "fastapi-restly",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy[asyncio]>=2.0.45",
    "aiosqlite>=0.21.0",
    "alembic>=1.15.2",
]

[project.optional-dependencies]
dev = [
    "fastapi-restly[testing]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shop"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
fastapi-restly = { path = "../../", editable = true }

# A plain .pth entry for the editable Restly: mypy does not follow the
# import-hook finder setuptools uses by default.
[tool.uv]
config-settings = { editable_mode = "compat" }

[tool.mypy]
strict = true
files = ["shop"]
