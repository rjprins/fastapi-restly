[project]
name = "blog"
version = "0.1.0"
description = "The blog API that the FastAPI-Restly tutorials build"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi-restly[standard]",
    "aiosqlite",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["blog"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.uv.sources]
fastapi-restly = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "fastapi-restly[testing]",
    "ipython>=8.37.0",
]

# A plain .pth entry for the editable Restly: mypy does not follow the
# import-hook finder setuptools uses by default.
[tool.uv]
config-settings = { editable_mode = "compat" }

# blog/main.py is the tutorial code, which leaves view methods unannotated like
# the rest of the docs. mypy checks the annotated parts; shop and saas run strict.
[tool.mypy]
files = ["blog"]
