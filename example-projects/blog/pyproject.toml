[project]
name = "blog"
version = "0.1.0"
description = "A minimal FastAPI-Restly example"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.12",
    "fastapi-restly",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy>=2.0.45",
    "alembic>=1.15.2",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["blog"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
fastapi-restly = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
    "ipython>=8.37.0",
]

# A plain .pth entry for the editable Restly: mypy does not follow the
# import-hook finder setuptools uses by default.
[tool.uv]
config-settings = { editable_mode = "compat" }

[tool.mypy]
strict = true
files = ["blog"]
