[project]
name = "myapp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi-restly[standard]>=0.9.0",
    "asyncpg>=0.30.0",
    "alembic>=1.15.2",
]

[dependency-groups]
dev = [
    "fastapi-restly[testing]>=0.9.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.asgi:app"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
